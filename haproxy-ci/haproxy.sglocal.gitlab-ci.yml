test:sglocal:
  extends: 
    - .test:default:image
  environment:
    name: sglocal
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached"' # Avoid spawning of additional pipelines
      when: never
    - changes:
        - configs/sglocal/*
        - configs/sglocal/*/*
build:sglocal:
  stage: build_sglocal
  extends: 
    - .build:default:image
  environment:
    name: sglocal
  only:
    refs:
      - main
      - kldr
    changes:
        - configs/sglocal/*
        - configs/sglocal/*/*
deploy:sglocal:
  needs: ['build:sglocal']
  extends: 
    - .deploy:default:image
  environment:
    name: sglocal
  only:
    refs:
      - main
      - kldr
    changes:
        - configs/sglocal/*
        - configs/sglocal/*/*