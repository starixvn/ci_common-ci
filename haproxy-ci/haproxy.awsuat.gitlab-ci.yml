test:awsuat:
  extends: 
    - .test:default:image
  environment:
    name: awsuat
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached"' # Avoid spawning of additional pipelines
      when: never
    - changes:
        - configs/awsuat/*
        - configs/awsuat/*/*
build:awsuat:
  stage: build_awsuat
  extends: 
    - .build:default:image
  environment:
    name: awsuat
  only:
    refs:
      - main
    changes:
        - configs/awsuat/*
        - configs/awsuat/*/*
deploy:awsuat:
  needs: ['build:awsuat']
  extends: 
    - .deploy:default:image
  environment:
    name: awsuat
  only:
    refs:
      - main
    changes:
        - configs/awsuat/*
        - configs/awsuat/*/*