test:gc:
  extends: 
    - .test:default:image
  environment:
    name: gc
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached"' # Avoid spawning of additional pipelines
      when: never
    - changes:
        - configs/gc/*
        - configs/gc/*/*
build:gc:
  stage: build_gc
  extends: 
    - .build:default:image
  environment:
    name: gc
  only:
    refs:
      - main
      - kldr
    changes:
        - configs/gc/*
        - configs/gc/*/*
deploy:gc:
  needs: ['build:gc']
  extends: 
    - .deploy:default:image
  environment:
    name: gc
  only:
    refs:
      - main
      - kldr
    changes:
        - configs/gc/*
        - configs/gc/*/*