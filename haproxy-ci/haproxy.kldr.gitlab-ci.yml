test:kldr:
  extends: 
    - .test:default:image
  environment:
    name: kldr
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached"' # Avoid spawning of additional pipelines
      when: never
    - changes:
        - configs/kldr/*
        - configs/kldr/*/*
build:kldr:
  stage: build_kldr
  extends: 
    - .build:default:image
  environment:
    name: kldr
  only:
    refs:
      - main
      - kldr
    changes:
        - configs/kldr/*
        - configs/kldr/*/*
deploy:kldr:
  needs: ['build:kldr']
  extends: 
    - .deploy:default:image
  environment:
    name: kldr
  only:
    refs:
      - main
      - kldr
    changes:
        - configs/kldr/*
        - configs/kldr/*/*