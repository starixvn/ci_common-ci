###LOCAL
test:local:
  extends: 
    - .test:default:image
  environment:
    name: local
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached"' # Avoid spawning of additional pipelines
      when: never
    - changes:
        - configs/local/*
        - configs/local/*/*
build:local:
  stage: build_local
  extends: 
    - .build:default:image
  environment:
    name: local
  only:
    refs:
      - main
      - kldr
    changes:
        - configs/local/*
        - configs/local/*/*
deploy:local:
  needs: ['build:local']
  extends: 
    - .deploy:default:image
  environment:
    name: local
  only:
    refs:
      - main
      - kldr
    changes:
        - configs/local/*
        - configs/local/*/*

