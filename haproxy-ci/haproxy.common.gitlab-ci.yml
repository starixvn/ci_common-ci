###LOCAL
test:local:
  extends: 
    - .test:default:image
  environment:
    name: local
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached"' # Avoid spawning of additional pipelines
      when: never
    - changes:
        - configs/local/*
        - configs/local/*/*
build:local:
  needs: ['test:local']
  extends: 
    - .build:default:image
  environment:
    name: local
  only:
    refs:
      - main
    changes:
        - configs/local/*
        - configs/local/*/*
deploy:local:
  needs: ['test:local']
  extends: 
    - .deploy:default:image
  environment:
    name: local
  only:
    refs:
      - main
    changes:
        - configs/local/*
        - configs/local/*/*

