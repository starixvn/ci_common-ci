test:alphakldr:
  extends: 
    - .test:default:image
  environment:
    name: alphakldr
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached"' # Avoid spawning of additional pipelines
      when: never
    - changes:
        - configs/alphakldr/*
        - configs/alphakldr/*/*
build:alphakldr:
  stage: build_alphakldr
  extends: 
    - .build:default:image
  environment:
    name: alphakldr
  only:
    refs:
      - main
    changes:
        - configs/alphakldr/*
        - configs/alphakldr/*/*
deploy:alphakldr:
  needs: ['build:alphakldr']
  extends: 
    - .deploy:default:image
  environment:
    name: alphakldr
  only:
    refs:
      - main
    changes:
        - configs/alphakldr/*
        - configs/alphakldr/*/*