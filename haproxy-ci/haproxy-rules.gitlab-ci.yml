workflow:
  rules:
###NEXCEL
    - if: '($CI_PROJECT_ID == "1945" || $CI_PROJECT_ID == "1939" || $CI_PROJECT_ID == "1937" || $CI_PROJECT_ID == "1938" || $CI_PROJECT_ID == "1940" || $CI_PROJECT_ID == "1936" || $CI_PROJECT_ID == "1941" || $CI_PROJECT_ID == "2718")'
      variables:
        ORG: "nexcel"
        REPOS: "default nexops legion rome olympus nexus spu nexent"
        REPOS_CORE: "core"
        GIT_URL: "gitlab.nexdev.net:NEXOPS/haproxy"
###LUMI
    - if: '($CI_PROJECT_ID == "630" || $CI_PROJECT_ID == "633" || $CI_PROJECT_ID == "632" || $CI_PROJECT_ID == "689" || $CI_PROJECT_ID == "985" || $CI_PROJECT_ID == "1030" )'
      variables:
        ORG: "luminet"
        REPOS: "default nexops sc1 vg2 gn"
        REPOS_CORE: "core"
        GIT_URL: "git3.nexdev.net:haproxy"