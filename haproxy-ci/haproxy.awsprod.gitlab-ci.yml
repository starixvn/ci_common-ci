test:awsprod:
  extends: 
    - .test:default:image
  environment:
    name: awsprod
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached"' # Avoid spawning of additional pipelines
      when: never
    - changes:
        - configs/awsprod/*
        - configs/awsprod/*/*
build:awsprod:
  stage: build_awsprod
  extends: 
    - .build:default:image
  environment:
    name: awsprod
  only:
    refs:
      - main
    changes:
        - configs/awsprod/*
        - configs/awsprod/*/*
deploy:awsprod:
  needs: ['build:awsprod']
  extends: 
    - .deploy:default:image
  environment:
    name: awsprod
  only:
    refs:
      - main
    changes:
        - configs/awsprod/*
        - configs/awsprod/*/*