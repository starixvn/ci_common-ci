image: $DOCKER_REG_LOCAL_URL/base/docker:20.10.7-bash-jq
stages:
  - test
  - build
  - deploy
############
include:
  - project: 'ci/common-ci'
    file: 'haproxy-ci/deploy-vars.gitlab-ci.yml'
  - project: 'ci/common-ci'
    file: 'haproxy-ci/haproxy-rules.gitlab-ci.yml'
  #- project: 'ci/common-ci'
  #  file: 'haproxy-ci/before-script.gitlab-ci.yml'
############
.test:default:image:
  stage: test
  script:
    - echo "test - $CI_ENVIRONMENT_NAME"
    - docker login -u $docker_reg_user -p $docker_reg_pass $docker_reg_url
    - docker build --no-cache --build-arg ENV="$CI_ENVIRONMENT_NAME" -f dockerfiles/Dockerfile -t haproxy-check-config .
    - if docker run --rm haproxy-check-config haproxy -c -V -f /etc/haproxy/haproxy.cfg; then
          docker image rm -f haproxy-check-config;
      else
          echo "Fatal errors found in configuration.";
          docker image rm -f haproxy-check-config;
          exit 1;
      fi;
    - echo "[$ORG] [$CI_ENVIRONMENT_NAME] - Testing is DONE!";
  tags:
    - docker

.build:default:image:
  stage: build
  script:
    - echo "build - $CI_ENVIRONMENT_NAME [$ORG]"
    - pwd
    - mkdir -p /root/.ssh/
    - cp dockerfiles/rsa/id_rsa /root/.ssh/
    - chmod -R 600 /root/.ssh/
    - ssh-keyscan -t rsa gitlab.nexdev.net >> /root/.ssh/known_hosts
    - ssh-keyscan -t rsa gitlab.starixsoft.com >> /root/.ssh/known_hosts
    - if [ "$ORG" == "Nexcel" ];
      then
        echo "$ORG";
        export REPOS="default nexops rome olympus nexus spu nex3" ;
      else
        echo "$ORG";
        export REPOS="default sc1 vg2" ;
      fi;
    - echo "repo $REPOS";
    - mkdir -p /haproxy/configs && mkdir -p /haproxy/compiled/$CI_ENVIRONMENT_NAME/{configs,maps}
    - cd /srv/
    - |
      for REPO in $REPOS
        do
          echo "git clone git@gitlab.nexdev.net:NEXOPS/haproxy/haproxy-${REPO}.git"
          git clone git@gitlab.nexdev.net:NEXOPS/haproxy/haproxy-${REPO}.git
      done
    - |
      for REPO in $REPOS
        do
          echo "cp -R /srv/haproxy-${REPO}/configs/$CI_ENVIRONMENT_NAME /haproxy/configs/"
          if [ -e /srv/haproxy-${REPO}/configs/$CI_ENVIRONMENT_NAME ] ; 
          then cp -R /srv/haproxy-${REPO}/configs/$CI_ENVIRONMENT_NAME /haproxy/configs/ ; 
          fi ;

      done
    - cat /haproxy/configs/$CI_ENVIRONMENT_NAME/*.cfg > /haproxy/compiled/$CI_ENVIRONMENT_NAME/configs/haproxy.cfg
    - cat /haproxy/configs/$CI_ENVIRONMENT_NAME/maps/*.map > /haproxy/compiled/$CI_ENVIRONMENT_NAME/maps/hosts.map
    - if [ -e /haproxy/configs/$CI_ENVIRONMENT_NAME/special-maps ] ; then cp /haproxy/configs/$CI_ENVIRONMENT_NAME/special-maps/* /haproxy/compiled/$CI_ENVIRONMENT_NAME/maps/ ; fi ;
    #- if [ "$ORG" == "Nexcel" ];
    - if [[ "$CI_ENVIRONMENT_NAME" == "local" || "$CI_ENVIRONMENT_NAME" == "local_test" ]];
        then cp -R /srv/haproxy-default/certs /haproxy/compiled/$CI_ENVIRONMENT_NAME/ ;
      else
        cp /srv/haproxy-default/whitelisted.ips /haproxy/compiled/$CI_ENVIRONMENT_NAME/ ;
      fi ;
    ########### Testing
    # - cp /haproxy/compiled/$ENV/haproxy.cfg /builds/troy.vo/testing-ci/haproxy.cfg
    # - cat /haproxy/compiled/$ENV/haproxy.cfg
    # - cp -R /haproxy/compiled/$ENV/maps /builds/troy.vo/testing-ci/
    # - cat /haproxy/compiled/$ENV/maps/hosts.map
    # - docker login -u $docker_reg_user -p $docker_reg_pass $docker_reg_url
    # - cd /builds/troy.vo/testing-ci && docker build --no-cache --build-arg ENV="$ENV" -f dockerfiles/Dockerfile -t haproxy-check-config .
    # - if docker run --rm haproxy-check-config haproxy -c -V -f /etc/haproxy/haproxy.cfg; then
    #       docker image rm -f haproxy-check-config;
    #   else
    #       echo "Fatal errors found in configuration.";
    #       docker image rm -f haproxy-check-config;
    #       exit 1;
    #   fi;
    ############ Testing
    ############### Compiled
    - git config --global user.email "ansible@nexdev.net"
    - git config --global user.name "ansible"
    - cd /srv
    - git clone git@gitlab.starixsoft.com:compiled/haproxy.git
    #####@ Clean up
    - if [ -e /srv/haproxy/$ORG/$ENV ] ; 
        then rm -R /srv/haproxy/$ORG/$ENV ;
        cd haproxy ;
        git add .;
        it commit -m "clean up - $ENV"  || echo "ignore commit failure, proceed";
        git push origin master;
      fi ;
    ####
    - mkdir -p /srv/haproxy/$ORG
    - cp -R /haproxy/compiled/$CI_ENVIRONMENT_NAME /srv/haproxy/$ORG/
    - cd /srv/haproxy && git add .
    - git commit -m "Change haproxy.cfg - $CI_ENVIRONMENT_NAME"  || echo "ignore commit failure, proceed"
    - git push origin master
    ###############
    - echo "[$ORG] [$CI_ENVIRONMENT_NAME] - Build is DONE!";
  tags:
    - docker

.deploy:default:image:
  stage: deploy
  script:
    - echo "deploy - $CI_ENVIRONMENT_NAME"
    - if [ "$ORG" == "Nexcel" ];
      then
        if echo $CI_ENVIRONMENT_NAME | grep -q "local_test"; then export ANSIBLE_JOB=898;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "local"; then export ANSIBLE_JOB=480;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "nexprod"; then export ANSIBLE_JOB=1162;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "uat"; then export ANSIBLE_JOB=494;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "sit"; then export ANSIBLE_JOB=606;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "prod-nex3"; then export ANSIBLE_JOB=496;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "alphaprod"; then export ANSIBLE_JOB=1433;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "gc"; then export ANSIBLE_JOB=1410;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "nexaws"; then export ANSIBLE_JOB=1365;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "fpsprod"; then export ANSIBLE_JOB=1421;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "prod"; then export ANSIBLE_JOB=528;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "aws-nex3"; then export ANSIBLE_JOB=651;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "aws"; then export ANSIBLE_JOB=693;
        fi;
      elif [ "$ORG" == "Lumi" ];
      then
        if echo $CI_ENVIRONMENT_NAME | grep -q "local_test"; then export ANSIBLE_JOB=1018;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "local"; then export ANSIBLE_JOB=474;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "uat"; then export ANSIBLE_JOB=472;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "sit"; then export ANSIBLE_JOB=472;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "prod"; then export ANSIBLE_JOB=473;
        elif echo $CI_ENVIRONMENT_NAME | grep -q "aws"; then export ANSIBLE_JOB=650;
        fi;
      fi;
    - if [ "$ANSIBLE_JOB" == "" ];
      then
        echo "$ORG - Currently, env $CI_ENVIRONMENT_NAME is not available to deploy!";
        exit 1;
      else
        echo $ANSIBLE_JOB;
        echo "[$ORG] [$CI_ENVIRONMENT_NAME] - Deploying HAProxy configs...";
        RUNJOBID=$(curl --fail -k -s --user $ansible_user:$ansible_pass -X POST "https://ansible.nexdev.net/api/v2/job_templates/$ANSIBLE_JOB/launch/" | jq .job);
        echo "Job link https://ansible.nexdev.net/#/jobs/playbook/$RUNJOBID";
        for i in {1..60}; do
          JOB_STATUS=$(curl -k -s --user $ansible_user:$ansible_pass "https://ansible.nexdev.net/api/v2/jobs/$RUNJOBID/" | jq .status);
          echo "Ansible Job Status is $JOB_STATUS";
          if [[ $JOB_STATUS == '"successful"' ]]; then
            IS_DONE=true;
            echo "[$ORG] [$CI_ENVIRONMENT_NAME] - Deployment is DONE!";
            break;
          elif [[ $JOB_STATUS == '"failed"' || $JOB_STATUS == '"canceled"' || $JOB_STATUS == '"error"' ]]; then
            IS_DONE=true;
            echo "[$ORG] [$CI_ENVIRONMENT_NAME] - Deployment is FAILED!!!";
            exit 1;
            break;
          fi;
          echo "waiting 10s...";
          sleep 10;
        done;
        if [ "$IS_DONE" != "true" ]; then
          echo "Timeout of 10 minutes was reached.";
          exit 1;
        fi;
      fi;
  tags:
    - docker
###LOCAL - NEXPROD
test:local:
  extends: 
    - .test:default:image
  environment:
    name: local
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached"' # Avoid spawning of additional pipelines
      when: never
    - changes:
        - configs/local/*
        - configs/local/*/*
deploy:local:
  needs: ['test:local']
  extends: 
    - .deploy:default:image
  environment:
    name: local
  only:
    refs:
      - main
    changes:
        - configs/local/*
        - configs/local/*/*

