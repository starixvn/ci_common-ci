image: hub.nexdev.net/base/docker:20.10.7-bash
stages:
  - test
  - deploy
############
#include:
  #- project: 'ci/common-ci'
  #  file: 'haproxy-ci/deploy-vars.gitlab-ci.yml'
  #- project: 'ci/common-ci'
  #  file: 'haproxy-ci/haproxy-rules.gitlab-ci.yml'
  #- project: 'ci/common-ci'
  #  file: 'haproxy-ci/before-script.gitlab-ci.yml'
############
.test:default:image:
  stage: test
  script:
    - echo "test - $CI_ENVIRONMENT_NAME"
    - docker build --no-cache --build-arg ENV="$CI_ENVIRONMENT_NAME" -f dockerfiles/Dockerfile -t haproxy-check-config .
    - if docker run --rm haproxy-check-config haproxy -c -V -f /etc/haproxy/haproxy.cfg; then
          docker image rm -f haproxy-check-config;
      else
          echo "Fatal errors found in configuration.";
          docker image rm -f haproxy-check-config;
          exit 1;
      fi;
    - echo "$ORG - Done testing for $CI_ENVIRONMENT_NAME !";
  tags:
    - docker

.deploy:default:image:
  stage: deploy
  script:
    - echo "deploy - $CI_ENVIRONMENT_NAME"
    - if [ "$ORG" == "Nexcel" ];
      then
        if echo $DEPLOY_ENV | grep -q "local_test"; then export ANSIBLE_JOB=898;
        elif echo $DEPLOY_ENV | grep -q "local"; then export ANSIBLE_JOB=480;
        elif echo $DEPLOY_ENV | grep -q "nexprod"; then export ANSIBLE_JOB=1162;
        elif echo $DEPLOY_ENV | grep -q "uat"; then export ANSIBLE_JOB=494;
        elif echo $DEPLOY_ENV | grep -q "sit"; then export ANSIBLE_JOB=606;
        elif echo $DEPLOY_ENV | grep -q "prod-nex3"; then export ANSIBLE_JOB=496;
        elif echo $DEPLOY_ENV | grep -q "prod"; then export ANSIBLE_JOB=528;
        elif echo $DEPLOY_ENV | grep -q "aws-nex3"; then export ANSIBLE_JOB=651;
        elif echo $DEPLOY_ENV | grep -q "aws"; then export ANSIBLE_JOB=693;
        fi;
      elif [ "$ORG" == "Lumi" ];
      then
        if echo $DEPLOY_ENV | grep -q "local_test"; then export ANSIBLE_JOB=1018;
        elif echo $DEPLOY_ENV | grep -q "local"; then export ANSIBLE_JOB=474;
        elif echo $DEPLOY_ENV | grep -q "uat"; then export ANSIBLE_JOB=472;
        elif echo $DEPLOY_ENV | grep -q "sit"; then export ANSIBLE_JOB=472;
        elif echo $DEPLOY_ENV | grep -q "prod"; then export ANSIBLE_JOB=473;
        elif echo $DEPLOY_ENV | grep -q "aws"; then export ANSIBLE_JOB=650;
        fi;
      fi;
    - if ["$ANSIBLE_JOB" == ""];
      then
        echo "$ORG - Currently, env $DEPLOY_ENV is not available to deploy!";
        exit 1;
      else
        echo $ANSIBLE_JOB;
        if curl --fail -k -s --user $ansible_user:$ansible_pass -X POST "https://ansible.nexdev.net/api/v2/job_templates/$ANSIBLE_JOB/launch/"; then
            echo "$ORG - Deploying application to $DEPLOY_ENV ...";
        fi;
        sleep 60;
        echo "$ORG - Done Deployment to $DEPLOY_ENV !";
      fi;
  tags:
    - docker
###LOCAL - NEXPROD
test:local:
  extends: 
    - .test:default:image
  environment:
    name: local
  rules:
    - changes:
        - configs/local/*
deploy:local:
  needs: ['test:local']
  extends: 
    - .deploy:default:image
  environment:
    name: local
  only:
    refs:
      - main
    changes:
        - configs/local/*

