image: $DOCKER_REG_LOCAL_URL/base/docker:20.10.7-bash-jq
stages:
  - test
  - build
  - deploy
############
include:
  - project: 'ci/common-ci'
    ref: master
    file: 'haproxy-ci/deploy-vars.gitlab-ci.yml'
  - project: 'ci/common-ci'
    ref: master
    file: 'haproxy-ci/haproxy-rules.gitlab-ci.yml'
  - project: 'ci/common-ci'
    ref: master
    file: 'haproxy-ci/haproxy.common.gitlab-ci.yml'
############
.test:default:image:
  stage: test
  script:
    - echo "test - $CI_ENVIRONMENT_NAME"
    - docker login -u $docker_reg_user -p $docker_reg_pass $docker_reg_url
    - docker build --no-cache --build-arg ENV="$CI_ENVIRONMENT_NAME" -f dockerfiles/Dockerfile -t haproxy-check-config .
    - if docker run --rm haproxy-check-config haproxy -c -V -f /etc/haproxy/haproxy.cfg; then
          docker image rm -f haproxy-check-config;
      else
          echo "Fatal errors found in configuration.";
          docker image rm -f haproxy-check-config;
          exit 1;
      fi;
    - echo "[$ORG] [$CI_ENVIRONMENT_NAME] - Testing is DONE!";
  tags:
    - docker

.build:default:image:
  stage: build
  script:
    - echo "build - $CI_ENVIRONMENT_NAME [$ORG]"
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_4" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -t rsa gitlab.starixsoft.com >> ~/.ssh/known_hosts
    - if [ "$ORG" == "nexcel" ];
      then
        ssh-keyscan -t rsa gitlab.nexdev.net >> ~/.ssh/known_hosts ;
      else
        ssh-keyscan -t rsa git3.nexdev.net >> ~/.ssh/known_hosts ;
      fi;
    - echo "$CI_PROJECT_NAME - $REPOS - $ORG - $CI_PROJECT_PATH - $GIT_URL";
    - mkdir -p /haproxy/configs && mkdir -p /haproxy/compiled/$CI_ENVIRONMENT_NAME/{configs,maps}
    - cd /srv/
    - |
      for REPO in $REPOS
        do
          git clone git@${GIT_URL}/haproxy-${REPO}.git
      done
    - |
      for REPO in $REPOS
        do
          if [ -e /srv/haproxy-${REPO}/configs/$CI_ENVIRONMENT_NAME ] ; 
          then cp -R /srv/haproxy-${REPO}/configs/$CI_ENVIRONMENT_NAME /haproxy/configs/$CI_PROJECT_NAME/ ;
          cat /haproxy/configs/$CI_PROJECT_NAME/$CI_ENVIRONMENT_NAME/*.cfg > /haproxy/compiled/$CI_ENVIRONMENT_NAME/configs/$CI_PROJECT_NAME.cfg ;
          cat /haproxy/configs/$CI_PROJECT_NAME/$CI_ENVIRONMENT_NAME/maps/*.map > /haproxy/compiled/$CI_ENVIRONMENT_NAME/maps/hosts.map ;
          if [ -e /haproxy/configs/$CI_ENVIRONMENT_NAME/special-maps ] ; then cp /haproxy/configs/$CI_PROJECT_NAME/$CI_ENVIRONMENT_NAME/special-maps/* /haproxy/compiled/$CI_ENVIRONMENT_NAME/maps/ ;fi ;
          fi ;
      done
    - if [[ "$CI_ENVIRONMENT_NAME" == "local" || "$CI_ENVIRONMENT_NAME" == "local_test" ]];
        then cp -R /srv/haproxy-default/certs /haproxy/compiled/$CI_ENVIRONMENT_NAME/ ;
      else
        cp /srv/haproxy-default/whitelisted.ips /haproxy/compiled/$CI_ENVIRONMENT_NAME/ ;
      fi ;
    ########### Testing
    # - cp /haproxy/compiled/$ENV/haproxy.cfg /builds/troy.vo/testing-ci/haproxy.cfg
    # - cat /haproxy/compiled/$ENV/haproxy.cfg
    # - cp -R /haproxy/compiled/$ENV/maps /builds/troy.vo/testing-ci/
    # - cat /haproxy/compiled/$ENV/maps/hosts.map
    # - docker login -u $docker_reg_user -p $docker_reg_pass $docker_reg_url
    # - cd /builds/troy.vo/testing-ci && docker build --no-cache --build-arg ENV="$ENV" -f dockerfiles/Dockerfile -t haproxy-check-config .
    # - if docker run --rm haproxy-check-config haproxy -c -V -f /etc/haproxy/haproxy.cfg; then
    #       docker image rm -f haproxy-check-config;
    #   else
    #       echo "Fatal errors found in configuration.";
    #       docker image rm -f haproxy-check-config;
    #       exit 1;
    #   fi;
    ############ Testing
    ############### Compiled
    - git config --global user.email "ansible@nexdev.net"
    - git config --global user.name "ansible"
    - cd /srv
    - git clone git@gitlab.starixsoft.com:compiled/haproxy.git
    #####@ Clean up
    - if [ -e /srv/haproxy/$ORG/$CI_ENVIRONMENT_NAME/$CI_PROJECT_NAME.cfg ] ; 
        then rm -R /srv/haproxy/$ORG/$CI_ENVIRONMENT_NAME/$CI_PROJECT_NAME.cfg ;
        # cd haproxy ;
        # git add .;
        # git commit -m "clean up - $ENV"  || echo "ignore commit failure, proceed";
        # git fetch origin && git pull origin master;
        # git push origin master;
      fi ;
    ####
    - mkdir -p /srv/haproxy/$ORG/$CI_ENVIRONMENT_NAME
    - cp -R /haproxy/compiled/$CI_ENVIRONMENT_NAME /srv/haproxy/$ORG
    - cd /srv/haproxy && git add .
    - git commit -m "Change cfg - $CI_PROJECT_NAME - $CI_ENVIRONMENT_NAME"  || echo "ignore commit failure, proceed"
    - git fetch origin && git pull origin master;
    - git push origin master
    ###############
    - echo "[$ORG] [$CI_ENVIRONMENT_NAME] - Build is DONE!";
  tags:
    - docker

.deploy:default:image:
  stage: deploy
  script:
    - echo "deploy - $CI_ENVIRONMENT_NAME"
    - if [ "$ORG" == "nexcel" ];
      then
        if echo $CI_ENVIRONMENT_NAME | grep -q "local_test"; then export ANSIBLE_JOB=898;export ANSIBLE_HOST="ansible.nexdev.net";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "local"; then export ANSIBLE_JOB=1693;export ANSIBLE_HOST="ansible.nexdev.net";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "nexprod"; then export ANSIBLE_JOB=1162;export ANSIBLE_HOST="ansible.nexdev.net";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "uat"; then export ANSIBLE_JOB=487;export ANSIBLE_HOST="ansible.starixplay.com";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "sit"; then export ANSIBLE_JOB=40;export ANSIBLE_HOST="ansible.playthefun.com";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "prod-nex3"; then export ANSIBLE_JOB=496;export ANSIBLE_HOST="ansible.nexdev.net";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "alphaprod"; then export ANSIBLE_JOB=1433;export ANSIBLE_HOST="ansible.nexdev.net";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "gc"; then export ANSIBLE_JOB=1410;export ANSIBLE_HOST="ansible.nexdev.net";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "nexaws"; then export ANSIBLE_JOB=1365;export ANSIBLE_HOST="ansible.nexdev.net";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "fpsprod"; then export ANSIBLE_JOB=1421;export ANSIBLE_HOST="ansible.nexdev.net";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "prod"; then export ANSIBLE_JOB=528;export ANSIBLE_HOST="ansible.nexdev.net";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "aws-nex3"; then export ANSIBLE_JOB=651;export ANSIBLE_HOST="ansible.nexdev.net";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "aws"; then export ANSIBLE_JOB=1694;export ANSIBLE_HOST="ansible.nexdev.net";
        fi;
      elif [ "$ORG" == "luminet" ];
      then
        if echo $CI_ENVIRONMENT_NAME | grep -q "local_test"; then export ANSIBLE_JOB=1018;export ANSIBLE_HOST="ansible.nexdev.net";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "local"; then export ANSIBLE_JOB=474;export ANSIBLE_HOST="ansible.nexdev.net";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "uat"; then export ANSIBLE_JOB=492;export ANSIBLE_HOST="ansible.starixplay.com";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "sit"; then export ANSIBLE_JOB=492;export ANSIBLE_HOST="ansible.starixplay.com";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "prod"; then export ANSIBLE_JOB=473;export ANSIBLE_HOST="ansible.nexdev.net";
        elif echo $CI_ENVIRONMENT_NAME | grep -q "aws"; then export ANSIBLE_JOB=650;export ANSIBLE_HOST="ansible.nexdev.net";
        fi;
      fi;
    - if [ "$ANSIBLE_JOB" == "" ];
      then
        echo "$ORG - Currently, env $CI_ENVIRONMENT_NAME is not available to deploy!";
        exit 1;
      else
        echo "$ANSIBLE_JOB - $ANSIBLE_HOST";
        echo "[$ORG] [$CI_ENVIRONMENT_NAME] - Deploying HAProxy configs...";
        RUNJOBID=$(curl --fail -k -s --user $ansible_user:$ansible_pass -X POST "https://$ANSIBLE_HOST/api/v2/job_templates/$ANSIBLE_JOB/launch/" | jq .job);
        echo "Job link https://$ANSIBLE_HOST/#/jobs/playbook/$RUNJOBID";
        for i in {1..60}; do
          JOB_STATUS=$(curl -k -s --user $ansible_user:$ansible_pass "https://$ANSIBLE_HOST/api/v2/jobs/$RUNJOBID/" | jq .status);
          echo "Ansible Job Status is $JOB_STATUS";
          if [[ $JOB_STATUS == '"successful"' ]]; then
            IS_DONE=true;
            echo "[$ORG] [$CI_ENVIRONMENT_NAME] - Deployment is DONE!";
            break;
          elif [[ $JOB_STATUS == '"failed"' || $JOB_STATUS == '"canceled"' || $JOB_STATUS == '"error"' ]]; then
            IS_DONE=true;
            echo "[$ORG] [$CI_ENVIRONMENT_NAME] - Deployment is FAILED!!!";
            exit 1;
            break;
          fi;
          echo "waiting 10s...";
          sleep 10;
        done;
        if [ "$IS_DONE" != "true" ]; then
          echo "Timeout of 10 minutes was reached.";
          exit 1;
        fi;
      fi;
  tags:
    - docker