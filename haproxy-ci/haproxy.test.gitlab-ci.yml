#### Testing
test:local_test:
  extends: 
    - .test:default:image
  environment:
    name: local_test
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached"' # Avoid spawning of additional pipelines
      when: never
    - changes:
        - configs/local_test/*
        - configs/local_test/*/*

build:local_test:
  needs: ['build:local_test']
  extends: 
    - .deploy:default:image
  environment:
    name: local_test
  only:
    refs:
      - main
    changes:
        - configs/local_test/*
        - configs/local_test/*/*

deploy:local_test:
  needs: ['test:local_test']
  extends: 
    - .deploy:default:image
  environment:
    name: local_test
  only:
    refs:
      - main
    changes:
        - configs/local_test/*
        - configs/local_test/*/*
