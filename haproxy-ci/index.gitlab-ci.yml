stages: 
  - test
  - deploy

############
include:
  - project: 'ci/common-ci'
    file: 'haproxy-ci/deploy-vars.gitlab-ci.yml'
  - project: 'ci/common-ci'
    file: 'haproxy-ci/before-script.gitlab-ci.yml'
  - project: 'ci/common-ci'
    file: 'haproxy-ci/deploy-rules.gitlab-ci.yml'

############

test:
  stage: test
  script:
    - echo "Compile and testing haproxy cfg ..."
    - docker build -f dockerfiles/Dockerfile_$DOCKERFILE_ENV -t haproxy-check-config .
    - if docker run --rm haproxy-check-config haproxy -c -V -f /etc/haproxy/haproxy.cfg; then
          echo "Configuration file is valid...";
      else
          curl --request DELETE --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/$CI_PROJECT_ID/repository/tags/$CI_COMMIT_TAG ;
          echo "Fatal errors found in configuration.";
      fi;
    - docker run --rm haproxy-check-config haproxy -c -V -f /etc/haproxy/haproxy.cfg
    - docker image rm -f haproxy-check-config;

deploy:  
  stage: deploy 
  script:
    - echo "Deploying application..."
    - if curl --fail -k -s --user $ansible_user:$ansible_pass -X POST "https://ansible.nexdev.net/api/v2/job_templates/$ANSIBLE_JOB/launch/"; then
          echo "Deployed done.";
      fi;
    - curl --request DELETE --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/$CI_PROJECT_ID/repository/tags/$CI_COMMIT_TAG