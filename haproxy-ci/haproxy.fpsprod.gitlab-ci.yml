test:fpsprod:
  extends: 
    - .test:default:image
  environment:
    name: fpsprod
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached"' # Avoid spawning of additional pipelines
      when: never
    - changes:
        - configs/fpsprod/*
        - configs/fpsprod/*/*
build:fpsprod:
  needs: ['test:fpsprod']
  extends: 
    - .build:default:image
  environment:
    name: fpsprod
  only:
    refs:
      - main
    changes:
        - configs/fpsprod/*
        - configs/fpsprod/*/*
deploy:fpsprod:
  needs: ['build:fpsprod']
  extends: 
    - .deploy:default:image
  environment:
    name: fpsprod
  only:
    refs:
      - main
    changes:
        - configs/fpsprod/*
        - configs/fpsprod/*/*