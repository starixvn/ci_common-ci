.if-deploy-local: &if-deploy-local
  if: '$CI_COMMIT_TAG =~ /local/'

.if-deploy-sit: &if-deploy-sit
  if: '$CI_COMMIT_TAG =~ /sit/'

.if-deploy-uat: &if-deploy-uat
  if: '$CI_COMMIT_TAG =~ /uat/'

.if-deploy-prod: &if-deploy-prod
  if: '$CI_COMMIT_TAG =~ /prod/'

unit-test-dotnet:
  stage: test
  image: hub.nexdev.net/base/dotnet/core/sdk:3.1-5-6-7
  tags:
    - docker
  before_script:
    - dotnet tool install --global coverlet.console --version 3.2.0
    - export PATH="$PATH:/root/.dotnet/tools"
    - dotnet nuget add source http://nuget.nexdev.net/api/v2
  script:
    - echo $SOLUTION_NAME
    - dotnet build $SOLUTION_NAME
    - for path in $(find ./ -iname '*Tests.dll');
      do
      if echo $path | grep 'bin';
      then
      coverlet $path --target "dotnet" --targetargs "test $path --no-build --logger:trx" --format opencover --output "${path##*/}-$(date +%s).coverage.opencover.xml";      
      fi
      done
  artifacts:
    when: always
    paths:
      - ./**/*.trx
      - ./**/*coverage.opencover.xml
    expire_in: 1 day
  allow_failure: true
  rules:
    - <<: *if-deploy-local
      when: never
    - <<: *if-deploy-sit
      when: never
    - <<: *if-deploy-uat
      when: never
    - <<: *if-deploy-prod
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: always
