.if-deploy-local: &if-deploy-local
  if: '$CI_COMMIT_TAG =~ /local/'

.if-deploy-sit: &if-deploy-sit
  if: '$CI_COMMIT_TAG =~ /sit/'

.if-deploy-uat: &if-deploy-uat
  if: '$CI_COMMIT_TAG =~ /uat/'

.if-deploy-prod: &if-deploy-prod
  if: '$CI_COMMIT_TAG =~ /prod/'

unit-test-js:
  stage: test
  image: registry.nexdev.net:5050/docker/node:14.15
  tags:
    - docker
  before_script:
    - npm set registry http://npm.lumigame.com
    - yarn global add jest
    - cd "$SRC_PATH" 
    - yarn install
  script:
    - npm run test-coverage
  rules:
    - <<: *if-deploy-local
      when: never
    - <<: *if-deploy-sit
      when: never
    - <<: *if-deploy-uat
      when: never
    - <<: *if-deploy-prod
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: always
  allow_failure: true
  artifacts:
    when: always
    paths:
      - ./**/lcov.info
      - ./reports
    expire_in: 1 day

