    SERVER_IP: $NEX3_SWARM_LEADER_LOCAL
    SERVER_USER: $NEX3_SWARM_LEADER_LOCAL_SSH_USER
    SERVER_PORT: $NEX3_SWARM_LEADER_LOCAL_SSH_PORT
    SWARM_NODES: $NEX3_SWARM_CLUSTER_LOCAL

