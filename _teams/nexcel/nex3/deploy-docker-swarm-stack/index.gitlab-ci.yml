variables:
  TRIVY_VERSION: "0.22.0"
  TRIVY_TOKEN: "H5nF5ywy262wt881ZWpq"
  TRIVY_SERVER: "http://10.18.200.131:1115"

include:
  - project: 'ci/common-ci'
    ref: rocketor
    file: 'common/env.gitlab-ci.yml'
  - project: 'ci/common-ci'
    ref: rocketor
    file: 'docker/base/before-script-docker.gitlab-ci.yml'
  - project: 'ci/common-ci'
    ref: rocketor
    file: 'docker/base/deploy-stack-swarm.gitlab-ci.yml'
  - project: 'ci/common-ci'
