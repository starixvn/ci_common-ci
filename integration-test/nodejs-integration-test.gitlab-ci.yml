integration-tests:
  stage: test
  tags:
    - docker

  services:
    - name: $NODEJS_INTEGRATION_TEST_DB_IMAGE_VERSION
      alias: mongo
      
  image: $NODEJS_INTEGRATION_TEST_IMAGE_VERSION
  before_script:
    - cp ./src/app-configs.IGT.js ./src/app-configs.IGT.original.js
    - cp ./configs/app-configs.IGT.js ./src/app-configs.IGT.js
    - npm set registry http://npm.lumigame.com
    - yarn install
    
  script:
    - npm run integration-test

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH && $ENABLE_NODEJS_INTEGRATION_TEST == "true"'

  artifacts:
    when: always
    paths:
      - ./coverage
    reports:
      junit:
        - junit.xml
    expire_in: 1 day