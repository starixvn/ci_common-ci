.build:default:windowsimage:
  stage: build
  before_script:
    - $DEPLOY_ENV=$CI_ENVIRONMENT_NAME
    - echo $DEPLOY_ENV
    - $ROCKETOR_API="$ROCKETOR_API_URL/Home/ChangeSpVersion"
    - $CI_REGISTRY_IMAGE="$DOCKER_REG_URL/$DOCKER_IMAGE_PATH"
    - $CI_REGISTRY_IMAGE_VERSION=$CI_COMMIT_SHA.SubString(0,8)
    - echo "${CI_REGISTRY_IMAGE}:${CI_REGISTRY_IMAGE_VERSION}"
    - if (!$PROJECT_ROOT_PATH) {
        echo "Root is here";
      } else {
          cd $PROJECT_ROOT_PATH;
      }
    - if ($CI_COMMIT_TAG -match '^deploy-.+-(local|sit|uat|prod|aws)[123]?-[a-z0-9]{8}(-([0-9\,]+))*' ){
        $REDMINE_IDS = $Matches.3;
      }else{
        $REDMINE_IDS = ''
      };
      echo $REDMINE_IDS;
  script:
    - ls .
    - echo "$DOCKER_FILE_PATH\$DOCKER_FILE_NAME"
    - docker login -u $DOCKER_REG_LOCAL_USERNAME -p $DOCKER_REG_LOCAL_PASSWORD $DOCKER_REG_LOCAL_URL
    - docker build --pull -f "$DOCKER_FILE_PATH\$DOCKER_FILE_NAME"
        --build-arg DEPLOY_ENV=${DEPLOY_ENV}
        --build-arg ROCKETOR_API=${ROCKETOR_API}
        --build-arg REDMINE_IDS=${REDMINE_IDS}
        --tag "${CI_REGISTRY_IMAGE}:${CI_REGISTRY_IMAGE_VERSION}" .
    - docker tag "${CI_REGISTRY_IMAGE}:${CI_REGISTRY_IMAGE_VERSION}" "${CI_REGISTRY_IMAGE}:${DEPLOY_ENV}-latest"
    - docker push "${CI_REGISTRY_IMAGE}:${DEPLOY_ENV}-latest"
  tags:
    - windows

.build:default:windowsimage:multistage:
  stage: build
  before_script:
    - $DEPLOY_ENV=$CI_ENVIRONMENT_NAME
    - echo $DEPLOY_ENV
    - $ROCKETOR_API="$ROCKETOR_API_URL/Home/ChangeSpVersion"
    - $CI_REGISTRY_IMAGE="$DOCKER_REG_URL/$DOCKER_IMAGE_PATH"
    - $CI_REGISTRY_IMAGE_VERSION=$CI_COMMIT_SHA.SubString(0,8)
    - echo "${CI_REGISTRY_IMAGE}:${CI_REGISTRY_IMAGE_VERSION}"
    - if (!$PROJECT_ROOT_PATH) {
        echo "Root is here";
      } else {
          cd $PROJECT_ROOT_PATH;
      }
    - if ($CI_COMMIT_TAG -match '^deploy-.+-(local|sit|uat|prod|aws)[123]?-[a-z0-9]{8}(-([0-9\,]+))*' ){
        $REDMINE_IDS = $Matches.3;
      }else{
        $REDMINE_IDS = ''
      };
      echo $REDMINE_IDS;
  script:
    - ls .
    - echo "$DOCKER_FILE_PATH\$DOCKER_FILE_NAME"
    - docker login -u $DOCKER_REG_LOCAL_USERNAME -p $DOCKER_REG_LOCAL_PASSWORD $DOCKER_REG_LOCAL_URL
    - Start-Process -FilePath "docker" -ArgumentList "pull ${CI_REGISTRY_IMAGE}:builder" -Wait
    - docker build
        --target builder
        --cache-from "${CI_REGISTRY_IMAGE}:builder"
        -f "$DOCKER_FILE_PATH\$DOCKER_FILE_NAME"
        --build-arg DEPLOY_ENV=${DEPLOY_ENV}
        --build-arg ROCKETOR_API=${ROCKETOR_API}
        --build-arg REDMINE_IDS=${REDMINE_IDS}
        --tag "${CI_REGISTRY_IMAGE}:builder" .
    - docker build
        --cache-from "${CI_REGISTRY_IMAGE}:builder"
        -f "$DOCKER_FILE_PATH/$DOCKER_FILE_NAME"
        --build-arg DEPLOY_ENV=${DEPLOY_ENV}
        --build-arg ROCKETOR_API=${ROCKETOR_API}
        --build-arg REDMINE_IDS=${REDMINE_IDS}
        --tag "${CI_REGISTRY_IMAGE}:${CI_REGISTRY_IMAGE_VERSION}" .
    - docker tag "${CI_REGISTRY_IMAGE}:${CI_REGISTRY_IMAGE_VERSION}" "${CI_REGISTRY_IMAGE}:${DEPLOY_ENV}-latest"
    - docker push "${CI_REGISTRY_IMAGE}:builder"
    - docker push "${CI_REGISTRY_IMAGE}:${DEPLOY_ENV}-latest"
  tags:
    - windows