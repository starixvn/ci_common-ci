.prepare-folder:
  script:
    - echo "$DEPLOYMENT_API"
    - curl -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F registryUser=$DOCKER_REG_USERNAME -F registryPassword=$DOCKER_REG_PASSWORD -F registryUrl=$DOCKER_REG_URL $DEPLOYMENT_API/loginRegistry?token=$DEPLOY_API_NEW_TOKEN
    - curl -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F workingDirectory=$WORKING_PATH $DEPLOYMENT_API/prepareFolderPermission?token=$DEPLOY_API_NEW_TOKEN

.transform-and-sync-docker-compose:
  script:
    - echo "===== TRANSFORM docker-compose.yml ... =====";
    - export DOCKER_COMPOSE_FILE=${ENV_NAME}.$DOCKER_COMPOSE_FILE_NAME.yml;
    - echo $DOCKER_COMPOSE_FILE
    - echo $DOCKER_COMPOSE_REPO_URL
    - echo $DOCKER_COMPOSE_REPO_BRANCH
    - git clone --branch $DOCKER_COMPOSE_REPO_BRANCH --single-branch $DOCKER_COMPOSE_REPO_URL compose_repo
    - cp compose_repo/$DOCKER_COMPOSE_REPO_PATH/$DOCKER_COMPOSE_FILE $DOCKER_COMPOSE_FILE_PATH
    - sed -i "s/@CONFIG_VERSION/$(date +%s)/g" $DOCKER_COMPOSE_FILE_PATH/$DOCKER_COMPOSE_FILE
    - sed -i "s/@DEPLOY_VERSION/$DEPLOY_VERSION/g" $DOCKER_COMPOSE_FILE_PATH/$DOCKER_COMPOSE_FILE
    - sed -i "s/@DOMAINS/$DOMAINS/g" $DOCKER_COMPOSE_FILE_PATH/$DOCKER_COMPOSE_FILE
    - echo "===== SYNC docker-compose.yml ... ====="
    - echo "Remote path --> $WORKING_PATH/$DEPLOY_ENV/docker-compose.yml"    
    - curl --fail -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F remotePath="$WORKING_PATH/$DEPLOY_ENV/docker-compose.yml" -F file=@"$DOCKER_COMPOSE_FILE_PATH/$DOCKER_COMPOSE_FILE" $DEPLOYMENT_API/scp?token=$DEPLOY_API_NEW_TOKEN

.sync-config:
  script:
    - echo $CONFIG_FILE_PATH/$CONFIG_FILE
    - ls -l $CONFIG_FILE_PATH
    - echo $TRANSFORM_CONFIG
    - if [ ! -z "$CONFIG_FILE_NAME" ];
      then
        echo "===== SYNC $CONFIG_FILE ... =====";
        curl --fail -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F remotePath="$WORKING_PATH/$DEPLOY_ENV/configs/$CONFIG_DEST_FILE" -F file=@"$CONFIG_FILE_PATH/$CONFIG_FILE" $DEPLOYMENT_API/scp?token=$DEPLOY_API_NEW_TOKEN;      
      fi

.remove-old-swarm-configs:
  script:
    - echo "===== REMOVING OLD CONFIGS ... =====";   
    - if [ ! -z "$CONFIG_FILE_NAME" ];
      then 
        curl -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F configName=${SERVICE_NAME}_${DEPLOY_ENV}_config $DEPLOYMENT_API/removeSwarmConfigs?token=$DEPLOY_API_NEW_TOKEN;        
      fi

.deploy-swarm-service:
  script:
    - echo "===== DEPLOYING SERVICE ... =====";    
    - curl --fail -F pipelineId=$CI_PIPELINE_ID -F env=$DEPLOY_ENV -F host=$SERVER_IP -F port=$SERVER_PORT -F user=$SERVER_USER -F workingDirectory=$WORKING_PATH -F stack=$STACK_NAME $DEPLOYMENT_API/deploySwarmService?token=$DEPLOY_API_NEW_TOKEN;   

cleanup:
  stage: .post
  before_script:
    - echo $CI_COMMIT_TAG
  script:
    - curl --request DELETE --header "PRIVATE-TOKEN:$CI_JOB_TOKEN" $GITLAB_API_URL/projects/$CI_PROJECT_ID/repository/tags/$CI_COMMIT_TAG
  tags:
    - docker
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy.*/ && $DEPLOY_BY == "rocketor"'
      when: always
