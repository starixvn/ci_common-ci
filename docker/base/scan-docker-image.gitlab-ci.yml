###############################
.scan_config:
  stage: scan-config
  script:
    - wget --no-verbose https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz?inline=false -O - | tar -zxvf -
    # Image report HIGH,CRITICAL
    - cat $DOCKER_FILE_PATH/$DOCKER_FILE_NAME
    - ls -l 
    #- ./trivy config --exit-code 1 --severity HIGH,CRITICAL $DOCKER_FILE_PATH
    - ./trivy config --exit-code 1 --severity HIGH,CRITICAL /
    - echo "done Scan Config!"
  allow_failure: true
  tags:
    - docker
