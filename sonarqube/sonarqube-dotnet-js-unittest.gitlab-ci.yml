.if-deploy-local: &if-deploy-local
  if: '$CI_COMMIT_TAG =~ /local/'

.if-deploy-sit: &if-deploy-sit
  if: '$CI_COMMIT_TAG =~ /sit/'

.if-deploy-uat: &if-deploy-uat
  if: '$CI_COMMIT_TAG =~ /uat/'

.if-deploy-prod: &if-deploy-prod
  if: '$CI_COMMIT_TAG =~ /prod/'

variables:
  SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar' # Defines the location of the analysis task cache
  GIT_DEPTH: 0 # Tells git to fetch all the branches of the project, required by the analysis task

scan-sonarqube-dotnet:
  stage: post-test
  needs: ['unit-test-dotnet','unit-test-js']
  dependencies:
    - unit-test-dotnet
    - unit-test-js
  image:
    name: hub.nexdev.net/base/dotnet/core/sdk:3.1-5-6-7-java11jre
  before_script:
    - dotnet tool install --global dotnet-sonarscanner --version 5.8.0
    - export PATH="$PATH:/root/.dotnet/tools"
    - dotnet nuget add source http://nuget.nexdev.net/api/v2
    - echo "===========Start Sonar Scanner============="
    - if [ "$SONAR_PROJECT_NAME" == "" ];
      then
      export SONAR_PROJECT_NAME=$PROJECT_NAME;
      else
      echo "$SONAR_PROJECT_NAME";
      fi
  script:
    - ls
    - dotnet sonarscanner begin /k:$PROJECT_NAME /n:"$SONAR_PROJECT_NAME"
      /v:"${CI_COMMIT_REF_NAME} ($CI_COMMIT_SHORT_SHA) [${CI_JOB_ID}]"
      /d:sonar.login=$SONAR_TOKEN
      /d:sonar.host.url=$SONAR_HOST_URL
      /d:sonar.qualitygate.wait=true
      /d:sonar.cs.opencover.reportsPaths=**/*.coverage.opencover.xml
      /d:sonar.cs.vstest.reportsPaths=**/*.trx
      /d:sonar.javascript.lcov.reportPaths=**/lcov.info
      /d:sonar.sources=${SRC_PATH}
      /d:sonar.tests=${TEST_PATH}
      /d:sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.spec.tsx,**/*.spec.ts
    - echo $SOLUTION_NAME
    - dotnet build $SOLUTION_NAME
    - dotnet sonarscanner end /d:sonar.login=$SONAR_TOKEN
  allow_failure: true
  rules:
    - <<: *if-deploy-local
      when: never
    - <<: *if-deploy-sit
      when: never
    - <<: *if-deploy-uat
      when: never
    - <<: *if-deploy-prod
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: always
