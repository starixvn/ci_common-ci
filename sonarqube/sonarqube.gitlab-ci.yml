.if-deploy-local: &if-deploy-local
  if: '$CI_COMMIT_TAG =~ /local/'

.if-deploy-sit: &if-deploy-sit
  if: '$CI_COMMIT_TAG =~ /sit/'

.if-deploy-uat: &if-deploy-uat
  if: '$CI_COMMIT_TAG =~ /uat/'

.if-deploy-prod: &if-deploy-prod
  if: '$CI_COMMIT_TAG =~ /prod/'

variables:
  SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar' # Defines the location of the analysis task cache
  GIT_DEPTH: 0 # Tells git to fetch all the branches of the project, required by the analysis task
cache:
  key: ${CI_JOB_NAME}
  paths:
    - .sonar/cache

sonarqube-check:
  stage: test
  image:
    name: registry.nexdev.net:5050/docker/sonarsource/sonar-scanner-cli:latest
  before_script:
    - echo "===========Start Sonar Scanner============="
    - if [ "$PROJECT_NAME" == "" ];
      then
      export PROJECT_NAME=$SERVICE_NAME;
      else
      echo "$PROJECT_NAME";
      fi
    - if [ "$SONAR_PROJECT_NAME" == "" ];
      then
      export SONAR_PROJECT_NAME=$PROJECT_NAME;
      else
      echo "$SONAR_PROJECT_NAME";
      fi
  script:
    - npm set registry http://npm.lumigame.com
    - npm install -g typescript
    - sonar-scanner 
      -X 
      -Dsonar.sourceEncoding=UTF-8 
      -Dsonar.qualitygate.wait=true 
      -Dsonar.projectKey=$PROJECT_NAME 
      -Dsonar.projectName="$SONAR_PROJECT_NAME" 
      -Dsonar.projectVersion="${CI_COMMIT_REF_NAME} ($CI_COMMIT_SHORT_SHA) [${CI_JOB_ID}]" 
      -Dproject.settings=./sonarqube.analysis.properties 
      -Dsonar.sources=.
  allow_failure: true
  rules:
    - <<: *if-deploy-local
      when: never
    - <<: *if-deploy-sit
      when: never
    - <<: *if-deploy-uat
      when: never
    - <<: *if-deploy-prod
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: always

