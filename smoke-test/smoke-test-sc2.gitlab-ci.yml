
smoke-test:
  stage: post-deploy
  variables:
    PRODUCT: $SMOKE_PRODUCT_NAME
    PROJECT: $SMOKE_PROJECT_NAME
    MODE: $SMOKE_MODE
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-.*-local\d*-.*/ && $DEPLOY_BY == "rocketor"'
  trigger: 
    project: rnd/testing/trigger-auto-sc2
    branch: master
